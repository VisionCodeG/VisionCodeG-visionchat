services:
  postgres:
    image: postgres:16-alpine
    container_name: visionchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tinode}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - visionchat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tinode}"]
      interval: 5s
      timeout: 5s
      retries: 15

  tinode:
    image: tinode/tinode-postgres:latest
    container_name: visionchat-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tinode}?sslmode=disable&connect_timeout=10"
      WAIT_FOR: "postgres:5432"
      DEFAULT_COUNTRY_CODE: "TJ"
    ports:
      - "6060:6060"

volumes:
  visionchat_pgdata:

name: VisionChat CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build VisionChat
        run: npm run build

      - name: Prepare local environment
        run: cp .env.example .env

      - name: Start Tinode stack
        run: docker compose up -d

      - name: Wait for Tinode health
        run: |
          for i in $(seq 1 45); do
            STATUS="$(docker inspect --format='{{.State.Health.Status}}' visionchat-server 2>/dev/null || true)"
            echo "Tinode health: ${STATUS:-unknown}"
            if [ "$STATUS" = "healthy" ]; then
              exit 0
            fi
            if [ "$STATUS" = "unhealthy" ]; then
              docker compose logs tinode
              exit 1
            fi
            sleep 2
          done
          docker compose logs tinode
          exit 1

      - name: HTTP smoke test
        run: curl --fail --retry 10 --retry-delay 1 --retry-all-errors http://localhost:6060/ > /dev/null

      - name: Stop Tinode stack
        if: always()
        run: docker compose down -v

name: VisionChat CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build VisionChat
        run: npm run build

      - name: Prepare local environment
        run: cp .env.example .env

      - name: Start Tinode stack
        run: docker compose up -d

      - name: Wait for Tinode
        run: |
          docker compose ps
          curl --fail --retry 20 --retry-delay 2 --retry-connrefused http://localhost:6060/ > /dev/null

      - name: Stop Tinode stack
        if: always()
        run: docker compose down -v
